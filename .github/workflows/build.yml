name: Build desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install Python deps (light, no AI packages)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "fastapi==0.115.*" "uvicorn[standard]==0.32.*" python-multipart yt-dlp yt-dlp-ejs curl_cffi "deep-translator>=1.11" certifi "faster-whisper==1.1.*" "transformers==4.46.3" sentencepiece protobuf

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: pyinstaller backend.spec --noconfirm

      - name: Install Node deps
        run: npm ci

      - name: Collect ffmpeg, ffprobe and deno into bin/
        run: |
          mkdir -p bin
          npm install --no-save ffmpeg-static ffprobe-static
          node -e "const fs=require('fs');const x=process.platform==='win32'?'.exe':'';fs.copyFileSync(require('ffmpeg-static'),'bin/ffmpeg'+x);fs.copyFileSync(require('ffprobe-static').path,'bin/ffprobe'+x)"
          DENO="$(which deno)"
          if [ -f "$DENO.exe" ]; then DENO="$DENO.exe"; fi
          cp "$DENO" bin/
          ls -la bin

      - name: Build frontend
        run: npm run build

      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap